<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>APEX Pump Station — ورود به گوگل</title>
<!--
  صفحهٔ بازگشتِ ورودِ گوگل (APEX Pump Station Manager)
  • اپِ اندروید: گوگل توکن را این‌جا (در مرورگرِ سیستم) می‌فرستد؛ این صفحه آن را با لینکِ
    apexps://oauth به خودِ اپ برمی‌گرداند.
  • وب/وبِ موبایل (وقتی پنجرهٔ ورود مسدود شد): توکن در حافظهٔ همین برنامه ذخیره و به
    index.html برگردانده می‌شود.
  نشانیِ این صفحه باید در Google Cloud → کلاینتِ Web → «Authorized redirect URIs» ثبت شود.
-->
<script src="apex-ns.js"></script>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #1e3a5f; font-family: Vazirmatn, Tahoma, sans-serif; color: #0f172a; }
  .box { background: #fff; border-radius: 18px; padding: 28px 24px; width: min(92vw, 380px); text-align: center;
         box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .box img { width: 72px; height: 72px; border-radius: 16px; }
  h2 { font-size: 18px; margin: 14px 0 8px; color: #1e3a5f; }
  p { font-size: 14px; line-height: 1.9; color: #475569; margin: 0 0 16px; }
  .btn { display: inline-block; background: #1e3a5f; color: #fff; text-decoration: none; border-radius: 12px;
         padding: 12px 22px; font-weight: 700; font-size: 15px; }
</style>
</head>
<body>
<div class="box">
  <img src="assets/icons/icon-192.png" alt="APEX Pump Station">
  <h2 id="t">در حالِ بازگشت به برنامه…</h2>
  <p id="m">لطفاً چند لحظه صبر کنید.</p>
  <a id="btn" class="btn" href="#" style="display:none;">بازگشت به برنامه</a>
</div>
<script>
(function () {
  'use strict';
  var T = document.getElementById('t'), M = document.getElementById('m'), B = document.getElementById('btn');
  var h = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  var q = new URLSearchParams(location.search || '');
  var token = h.get('access_token');
  var err = h.get('error') || q.get('error');
  var state = h.get('state') || q.get('state') || '';
  var exp = h.get('expires_in') || '3600';
  // توکن از نوارِ آدرس و تاریخچه پاک شود
  try { history.replaceState(null, '', location.pathname); } catch (e) {}

  if (state.indexOf('app.') === 0) {
    // ── اپِ اندروید ──
    var params = token
      ? 'access_token=' + encodeURIComponent(token) + '&expires_in=' + encodeURIComponent(exp) + '&state=' + encodeURIComponent(state)
      : 'error=' + encodeURIComponent(err || 'cancelled') + '&state=' + encodeURIComponent(state);
    var custom = 'apexps://oauth?' + params;
    var intent = 'intent://oauth?' + params + '#Intent;scheme=apexps;package=com.apexpump.station;end';
    var link = /android/i.test(navigator.userAgent || '') ? intent : custom;
    B.href = link;
    B.style.display = 'inline-block';
    T.textContent = token ? 'ورود موفق بود' : 'ورود انجام نشد';
    M.textContent = token ? 'اگر خودکار به برنامه برنگشتید، دکمهٔ زیر را بزنید.' : 'به برنامه برگردید و دوباره تلاش کنید.';
    try { location.replace(link); } catch (e) {}
    return;
  }

  // ── وب / وبِ موبایل ──
  var expected = null;
  try { expected = localStorage.getItem('apexps_oauth_state'); localStorage.removeItem('apexps_oauth_state'); } catch (e) {}
  var ok = !!(token && expected && state === expected);
  if (ok) {
    try {
      localStorage.setItem('jouya_gdrive_token', JSON.stringify({ access_token: token, expires_in: parseInt(exp, 10) || 3600, savedAt: Date.now() }));
    } catch (e) { ok = false; }
  }
  T.textContent = ok ? 'ورود موفق بود' : 'ورود انجام نشد';
  var back = 'index.html?gdrive=' + (ok ? 'ok' : 'err');
  B.href = back; B.style.display = 'inline-block';
  setTimeout(function () { location.replace(back); }, 300);
})();
</script>
</body>
</html>
